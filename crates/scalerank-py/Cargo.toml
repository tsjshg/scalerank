[package]
name = "scalerank-py"
description = "Python bindings of scalerank (the scalerank package on PyPI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[features]
# the Rust UMAP and t-SNE, for the research scripts; not in the published wheel
baselines = ["dep:scalerank-baselines"]

[dependencies]
scalerank = { path = "../scalerank" }
scalerank-baselines = { path = "../scalerank-baselines", optional = true }
pyo3 = "0.30"
numpy = "0.30"
