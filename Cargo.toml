[workspace]
resolver = "3"
members = ["crates/scalerank", "crates/scalerank-baselines", "crates/scalerank-py"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
repository = "https://github.com/tsjshg/scalerank"

[profile.release]
lto = "thin"
codegen-units = 1

# tests run the optimiser on small data; unoptimised they take minutes
[profile.test]
opt-level = 3
